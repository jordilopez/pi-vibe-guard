name: tests

# The merge gate for master. Branch protection requires the `unit tests`
# job by name — if you rename the job below, update the required status
# check too, or master becomes permanently unmergeable.
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

# Read source, write nothing. The suite needs no credentials.
permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      # Version comes from .nvmrc (24.x), where `node --test` runs .ts
      # files via native type stripping — no build step and no deps.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Run unit tests
        run: npm test
